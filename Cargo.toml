[workspace]
resolver = "3"
members = ["crates/newsbar-core", "src-tauri"]

[workspace.package]
edition = "2024"
version = "0.1.0"
publish = false

[workspace.dependencies]
newsbar-core = { path = "crates/newsbar-core" }
async-trait = "0.1.92"
chrono = { version = "0.4.45", features = ["serde"] }
dom_smoothie = "0.18.2"
feed-rs = "3.0.0"
flate2 = "1.1.10"
futures = "0.3"
html2text = "0.17.4"
keyring = "4.2.0"
reqwest = { version = "0.13.5", features = ["json", "stream", "gzip", "brotli", "deflate"] }
rusqlite = { version = "0.41.0", features = ["bundled", "chrono"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smappservice-rs = "0.1.3"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
url = "2.5.8"
wiremock = "0.6.5"
