[package]
name = "newsbar"
description = "AI・セキュリティの新着をメニューバーで読むアプリ"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "newsbar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
chrono.workspace = true
keyring.workspace = true
newsbar-core.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.12.5", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2.7.2"
tauri-plugin-positioner = { version = "2.4.0", features = ["tray-icon"] }
tokio.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSWorkspace"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSNotification", "NSOperation", "block2"] }
smappservice-rs = "0.1.3"
