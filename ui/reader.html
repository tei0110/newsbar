<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>newsbar</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body class="reader">
    <header class="pop-header">
      <div class="pop-title">
        <strong id="count">新着 0件</strong>
        <span id="updated" class="muted"></span>
      </div>
      <div class="pop-actions">
        <span class="muted key-hint">↑↓ / j k で移動・Enter で元記事</span>
        <button id="refresh" type="button">⟳ 更新</button>
        <button id="settings" type="button">⚙ 設定</button>
      </div>
    </header>
    <div id="banners"></div>
    <div class="reader-body">
      <section class="reader-list-pane">
        <nav id="tabs" class="tabs"></nav>
        <main id="list" class="list"></main>
        <footer class="pop-footer">
          <button id="mark-all" type="button">すべて既読にする</button>
          <label class="toggle"><input id="include-read" type="checkbox" /> 既読も表示</label>
        </footer>
      </section>
      <article id="detail" class="reader-detail"></article>
    </div>
    <script type="module" src="./src/reader.ts"></script>
  </body>
</html>
