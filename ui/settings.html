<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>newsbar の設定</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body class="settings">
    <h1>設定</h1>

    <h2>情報源</h2>
    <div id="sources" class="card"></div>

    <h2>情報源を追加</h2>
    <div class="card">
      <form id="add-form" class="add">
        <input id="add-name" type="text" placeholder="名前" required />
        <input id="add-url" type="url" placeholder="フィードの URL" required />
        <select id="add-label">
          <option value="AI">AI</option>
          <option value="セキュリティ">セキュリティ</option>
          <option value="技術全般">技術全般</option>
        </select>
        <button id="add-button" type="submit">追加</button>
      </form>
      <div id="add-error" class="form-error" hidden></div>
    </div>

    <h2>おすすめ</h2>
    <div id="recommended" class="card"></div>

    <h2>AI要約</h2>
    <div class="card">
      <form id="key-form" class="row">
        <label class="grow">
          <div class="name">APIキー（Anthropic）</div>
          <input id="api-key" type="password" placeholder="sk-ant-…" autocomplete="off" />
        </label>
        <span id="key-status" class="badge"></span>
        <button id="key-save" type="submit">保存</button>
      </form>
      <div class="row">
        <label class="grow">
          <div class="name">モデル</div>
          <input id="model" type="text" spellcheck="false" />
        </label>
      </div>
      <div class="row">
        <label class="grow">
          <div class="name">要約の言語</div>
          <select id="language">
            <option value="ja">日本語</option>
            <option value="en">English</option>
          </select>
        </label>
      </div>
      <div id="settings-error" class="form-error" hidden></div>
    </div>

    <h2>自動更新の間隔</h2>
    <div class="card">
      <div class="row">
        <select id="interval">
          <option value="30">30分</option>
          <option value="60">1時間</option>
          <option value="180">3時間</option>
          <option value="360">6時間</option>
        </select>
      </div>
    </div>

    <h2>起動</h2>
    <div class="card">
      <div class="row">
        <label class="grow"><input id="autostart" type="checkbox" /> ログイン時に起動</label>
      </div>
      <div id="autostart-error" class="form-error" hidden></div>
    </div>

    <script type="module" src="./src/settings.ts"></script>
  </body>
</html>
