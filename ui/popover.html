<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>newsbar</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body class="popover">
    <header class="pop-header">
      <div class="pop-title">
        <strong id="count">新着 0件</strong>
        <span id="updated" class="muted"></span>
      </div>
      <div class="pop-actions">
        <button id="refresh" type="button">⟳ 更新</button>
        <button id="reader" type="button" title="広い画面で読む">⤢ 広げる</button>
        <button id="settings" type="button">⚙ 設定</button>
      </div>
    </header>
    <div id="banners"></div>
    <nav id="tabs" class="tabs"></nav>
    <main id="list" class="list"></main>
    <footer class="pop-footer">
      <button id="mark-all" type="button">すべて既読にする</button>
      <label class="toggle"><input id="include-read" type="checkbox" /> 既読も表示</label>
    </footer>
    <script type="module" src="./src/popover.ts"></script>
  </body>
</html>
